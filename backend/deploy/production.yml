# Moimio CE — production compose template for the hosted SaaS.
#
# This file is read by the Moimio SaaS provisioning driver. For each
# new tenant, the SaaS writes a per-tenant .env file alongside this
# compose and runs `docker compose up` against both.
#
# Self-hosters do NOT use this file — they use docker-compose.yml at
# the project root (the dev compose, with build contexts and source
# mounts suited to local development).
#
# Why this lives under backend/deploy/ specifically:
#   The CI workflow builds the backend image with `context: ./backend`
#   (.github/workflows/build.yml). For this file to ship inside the
#   built backend image, it has to be reachable from that build
#   context. The existing `COPY . .` step in backend/Dockerfile then
#   copies it to /app/deploy/production.yml inside the image, which
#   is where the SaaS provisioner reads it from.
#
# Required vars use ${VAR:?...} syntax — the stack refuses to start
# if any are missing. Optional vars use ${VAR:-default} fallbacks.
#
# Image versions are pinned to a specific GHCR tag matching the CE
# release this template was bundled with. Upgrades happen by rendering
# a fresh template from a newer release. Never :latest.
#
# Network topology:
#   moimio-${SUBDOMAIN}-internal  — per-tenant: db + backend + frontend
#   moimio-public                  — shared:     frontend + outer Caddy
# The backend is unreachable from outside the tenant's internal net.

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/pistio/moimio-backend:v1.0.5
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY must be set}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      RATE_LIMIT_REGISTRATION: ${RATE_LIMIT_REGISTRATION:-60}
      # SMTP — the SaaS provisioner injects Scaleway TEM credentials
      # (send.moimio.app) by default. Self-hoster overrides via
      # tenant-specific .env are supported once admin-UI per-tenant
      # overrides ship (SAAS-3).
      SMTP_HOST:       ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASSWORD:   ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}
      SMTP_FROM_NAME:  ${SMTP_FROM_NAME:-Moimio}
      SMTP_TLS:        ${SMTP_TLS:-true}
      SMTP_SSL:        ${SMTP_SSL:-false}
      # Capability flags + outbound webhook config (v1.0.0g-3 lineage).
      FEATURE_ALLOCATION:                ${FEATURE_ALLOCATION:?FEATURE_ALLOCATION must be set}
      # v1.0.4a: default OFF. A capability must be switched on explicitly;
      # a dropped variable must never grant more than was configured.
      FEATURE_OUTBOUND_WEBHOOKS:         ${FEATURE_OUTBOUND_WEBHOOKS:-false}
      # v1.0.4a: outbound webhooks refuse private/internal targets unless
      # this is set. Self-hosters only; the SaaS never sets it.
      WEBHOOK_ALLOW_PRIVATE_TARGETS:     ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      FEATURE_CREATE_EVENT_CONFIRMATION: ${FEATURE_CREATE_EVENT_CONFIRMATION:-false}
      # v1.0.2b: managed-instance signal (see docker-compose.yml note).
      # Defaults false so a missing value merely hides hosted-only UI.
      FEATURE_ACCOUNT_PORTAL:            ${FEATURE_ACCOUNT_PORTAL:-false}
      EVENT_CHARGE_AMOUNT:   ${EVENT_CHARGE_AMOUNT:-}
      EVENT_CHARGE_CURRENCY: ${EVENT_CHARGE_CURRENCY:-}
      BILLING_CARD_LAST4:    ${BILLING_CARD_LAST4:-}
      PUBLIC_ORIGIN:       ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN must be the canonical Hosted HTTPS origin}
      MOIMIO_TENANT_ID:      ${MOIMIO_TENANT_ID:?MOIMIO_TENANT_ID must be set}
      MOIMIO_WEBHOOK_URL:    ${MOIMIO_WEBHOOK_URL:?MOIMIO_WEBHOOK_URL must be set}
      MOIMIO_WEBHOOK_SECRET: ${MOIMIO_WEBHOOK_SECRET:?MOIMIO_WEBHOOK_SECRET must be set}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      # Optional participant cap (SaaS injects it per tenant). Blank/unset
      # means no cap: CE coerces a blank value to "no check" and never
      # blocks registration. Self-hosters who don't set it get the empty
      # default, i.e. no cap.
      MOIMIO_PARTICIPANT_CAP: ${MOIMIO_PARTICIPANT_CAP:-}
      # v1.0.0aa: SaaS account-portal URL. Optional; blank/unset means no
      # "Manage account" sidebar link (self-hosters get the empty default).
      # The SaaS injects its portal URL here per tenant. Surfaced to the
      # frontend via GET /api/capabilities.
      ACCOUNT_URL: ${ACCOUNT_URL:-}
      # v1.0.4c: demo-workspace notice. Defaults false so a missing value
      # merely hides the notice; the SaaS sets it for demo tenants only.
      FEATURE_DEMO_NOTICE:  ${FEATURE_DEMO_NOTICE:-false}
      MOIMIO_DEMO_MAIL_URL: ${MOIMIO_DEMO_MAIL_URL:-}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/pistio/moimio-frontend:v1.0.5
    restart: unless-stopped
    networks:
      - internal
      - public
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  internal:
    name: moimio-${SUBDOMAIN:?SUBDOMAIN must be set}-internal
  public:
    name: moimio-public
    external: true
